<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MUSHIWA KIMPUTU ARTHUR</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Playfair+Display:ital,wght@1,500;1,600&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    background:#050505;
    color:#fff;
    font-family:"Cinzel",serif;
    overflow-x:hidden;
}

/* FOND LUXUEUX */
body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background:
        radial-gradient(circle at 50% 20%,rgba(218,164,42,.18),transparent 30%),
        radial-gradient(circle at 10% 90%,rgba(218,164,42,.10),transparent 25%),
        radial-gradient(circle at 90% 70%,rgba(218,164,42,.10),transparent 25%);
}

/* PAGE */
.page{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px 15px;
}

/* CARTE */
.card{
    position:relative;
    width:min(850px,100%);
    padding:55px 35px 45px;
    text-align:center;

    background:
        linear-gradient(
            145deg,
            #17130a,
            #050505 35%,
            #161108 70%,
            #030303
        );

    border:1px solid #b88721;

    box-shadow:
        0 0 0 5px #090909,
        0 0 0 7px #6d4a0e,
        0 0 35px rgba(216,165,45,.25),
        inset 0 0 50px rgba(216,165,45,.08);

    overflow:hidden;
}

/* LIGNES DÉCORATIVES */
.card::before,
.card::after{
    content:"";
    position:absolute;
    width:170px;
    height:170px;
    border:1px solid rgba(221,177,65,.6);
    transform:rotate(45deg);
}

.card::before{
    top:-125px;
    left:-125px;
}

.card::after{
    bottom:-125px;
    right:-125px;
}

/* PETITS DIAMANTS */
.diamond{
    color:#ffe8a0;
    font-size:22px;
    text-shadow:
        0 0 5px white,
        0 0 15px #d9a52d;
}

/* LOGO */
.logo{
    width:105px;
    height:105px;
    margin:0 auto 18px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    border:2px solid #e0b53f;

    background:
        radial-gradient(circle,#392709,#080704 70%);

    box-shadow:
        0 0 12px rgba(255,209,80,.6),
        inset 0 0 20px rgba(255,207,80,.15);
}

.logo span{
    font-size:31px;
    font-weight:800;

    background:
        linear-gradient(
            180deg,
            #fff2a7,
            #d79c20,
            #fff0a0
        );

    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}

/* NOM */
.brand{
    font-size:clamp(23px,5vw,48px);
    font-weight:800;
    letter-spacing:2px;

    background:
        linear-gradient(
            180deg,
            #fff3b0,
            #e4ae32 45%,
            #a96d09 70%,
            #ffe990
        );

    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;

    text-shadow:0 0 20px rgba(232,180,55,.25);
}

/* LIGNE */
.line{
    display:flex;
    align-items:center;
    gap:15px;
    margin:22px auto 35px;
    width:80%;
}

.line::before,
.line::after{
    content:"";
    height:1px;
    flex:1;
    background:linear-gradient(
        90deg,
        transparent,
        #d6a22b
    );
}

.line::after{
    background:linear-gradient(
        90deg,
        #d6a22b,
        transparent
    );
}

/* TITRE */
.title{
    font-family:"Playfair Display",serif;
    font-style:italic;

    font-size:clamp(55px,12vw,105px);

    background:
        linear-gradient(
            180deg,
            #fff9cf 0%,
            #ffd85a 30%,
            #c7890e 65%,
            #fff0a1 100%
        );

    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;

    filter:
        drop-shadow(0 2px 2px #000)
        drop-shadow(0 0 12px rgba(255,202,60,.4));

    margin-bottom:20px;
}

/* TEXTE */
.text{
    max-width:680px;
    margin:auto;

    font-family:"Playfair Display",serif;
    font-size:clamp(22px,4vw,37px);
    line-height:1.5;

    color:#f9f1d7;
}

/* NOM APPLICATION */
.app{
    display:inline-block;
    margin-top:28px;
    padding:13px 24px;

    border-top:1px solid #f3d16c;
    border-bottom:1px solid #b67d11;

    color:#ffd967;

    font-size:clamp(19px,3.5vw,31px);
    font-weight:800;
    letter-spacing:1px;

    text-shadow:0 0 10px rgba(255,201,65,.35);
}

/* SEPARATEUR */
.separator{
    margin:35px auto 25px;
    width:70%;
    height:1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #dca62e,
            transparent
        );
}

/* CONTACT */
.contact-label{
    color:#cdb77b;
    font-size:clamp(15px,2.5vw,21px);
    letter-spacing:1px;
}

/* WHATSAPP */
.whatsapp{
    display:inline-flex;
    align-items:center;
    gap:13px;

    margin-top:15px;
    padding:12px 25px;

    border:1px solid #d9aa35;
    border-radius:40px;

    background:
        linear-gradient(
            135deg,
            #2a210e,
            #0b0a06
        );

    color:#f9d86b;

    font-size:clamp(20px,4vw,32px);
    font-weight:700;

    box-shadow:
        0 0 15px rgba(218,165,45,.2);
}

/* LOGO WHATSAPP */
.whatsapp-icon{
    width:40px;
    height:40px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;
    background:#25D366;
}

.whatsapp-icon svg{
    width:26px;
    height:26px;
    fill:white;
}

/* BAS */
.footer{
    margin-top:30px;
    color:#806728;
    font-size:13px;
    letter-spacing:4px;
}

/* MOBILE */
@media(max-width:600px){

    .page{
        padding:18px 10px;
    }

    .card{
        padding:40px 20px 35px;
    }

    .logo{
        width:85px;
        height:85px;
    }

    .logo span{
        font-size:26px;
    }

    .text{
        font-size:21px;
    }

    .app{
        font-size:19px;
        padding:11px 14px;
    }

    .whatsapp{
        font-size:18px;
        padding:10px 16px;
    }

    .whatsapp-icon{
        width:35px;
        height:35px;
    }
}
</style>
